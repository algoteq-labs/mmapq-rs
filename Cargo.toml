[package]
name = "mmapq"
version = "0.2.1-dev"
edition = "2021"
description = "Idiomatic Rust bindings for mmapq — low-latency shared-memory indexed queue"
license = "BSD-3-Clause"
repository = "https://github.com/algoteq-labs/mmapq-rs"
readme = "README.md"
keywords = ["mmap", "shared-memory", "queue", "lock-free", "high-performance"]
categories = ["data-structures"]
links = "mmapq"
# Published files are whitelisted. The crate needs only the Rust sources and
# the vendored C library sources/headers (built by build.rs). Not shipped:
# tests/ (they need the full repo: cross_process.rs runs make in c/), and the
# rest of c/ (C tests, docs, scripts, CI files). scripts/check_package.sh
# checks the packaged C files against the files git tracks in c/.
include = [
    "/Cargo.toml", "/Cargo.lock", "/build.rs", "/README.md", "/LICENSE",
    "/RELEASE-NOTES-*.md",
    "/src/**/*.rs", "/examples/*.rs",
    "/c/LICENSE", "/c/src/**/*.c", "/c/src/**/*.h", "/c/include/**/*.h",
]

[build-dependencies]
cc = "1.0"

[dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1

[lib]
name = "mmapq"
path = "src/lib.rs"

[[example]]
name = "echo_server"
path = "examples/echo_server.rs"

[[example]]
name = "latency_bench"
path = "examples/latency_bench.rs"

[[example]]
name = "batch_echo_server"
path = "examples/batch_echo_server.rs"

[[example]]
name = "batch_latency_bench"
path = "examples/batch_latency_bench.rs"
