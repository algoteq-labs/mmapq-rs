name: CI

on:
  push:
    branches:
      - main
      - 'ci-check/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust tests (committed gitlink)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout mmapq-rs (committed gitlink)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: CAND-55 hygiene wipe
        shell: bash
        run: |
          find c -name '*.o' -delete
          find c -name 'libmmapq.a' -delete
      - name: cargo test
        run: cargo test
