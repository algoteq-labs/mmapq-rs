name: CI

on:
  push:
    branches:
      - main
      - 'ci-check/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust tests (committed gitlink)${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, suffix: '', timeout: 30 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, suffix: ' [arm64]', timeout: 60 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Platform
        run: |
          uname -m
          nproc
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Checkout mmapq-rs (committed gitlink)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version set by toolchain input
        with:
          toolchain: 1.99.1
      - name: CAND-55 hygiene wipe
        shell: bash
        run: |
          find c -name '*.o' -delete
          find c -name 'libmmapq.a' -delete
      - name: cargo test
        run: cargo test --no-fail-fast
      - name: Binding coverage gate (every public binding method directly tested)
        run: bash c/scripts/check_binding_coverage.sh --rust .

  package:
    name: Package (crate)${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, suffix: '', timeout: 15 }
          - { runner: ubuntu-24.04-arm, arch: aarch64, suffix: ' [arm64]', timeout: 30 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - name: Platform
        run: |
          uname -m
          nproc
          test "$(uname -m)" = "${{ matrix.arch }}"
      - name: Checkout mmapq-rs (committed gitlink)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch; version set by toolchain input
        with:
          toolchain: 1.99.1
      - name: Check, verify and smoke-test the packaged crate
        run: bash scripts/check_package.sh
      - name: Build with GCC 14
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
          gcc-14 --version | head -1
          # A separate target directory, so the C sources are compiled again, by gcc-14.
          CC=gcc-14 CARGO_TARGET_DIR="$RUNNER_TEMP/gcc14-target" cargo build --release -vv 2>&1 | tee "$RUNNER_TEMP/gcc14.log"
          # the cc crate logs the compiler it picked from CC for this crate's build script
          grep -qF '[mmapq ' "$RUNNER_TEMP/gcc14.log" && grep -qF 'CC = Some(gcc-14)' "$RUNNER_TEMP/gcc14.log" \
            || { echo "the C sources were not compiled with gcc-14"; exit 1; }
